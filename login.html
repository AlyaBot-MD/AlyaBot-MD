<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlyaBot-MD - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1a1f35 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid #6366f1;
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.3);
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #6366f1;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #cbd5e1;
            font-size: 1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #f1f5f9;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(99, 102, 241, 0.4);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            border-left: 4px solid #ef4444;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.2);
            color: #86efac;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            border-left: 4px solid #10b981;
        }

        .whatsapp-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #334155;
            text-align: center;
        }

        .whatsapp-section p {
            color: #cbd5e1;
            margin-bottom: 12px;
            font-size: 0.9em;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 20px;
            background: #25d366;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 0.95em;
        }

        .whatsapp-btn:hover {
            background: #20ba5a;
            transform: scale(1.05);
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #64748b;
            font-size: 0.85em;
        }

        .footer a {
            color: #6366f1;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            color: #6366f1;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #334155;
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                padding: 30px 20px;
            }

            .login-header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🤖 AlyaBot-MD</h1>
            <p>Portal de APIs Gratuitas</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">📧 Correo Electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="tu@email.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">🔑 Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Ingresa tu contraseña"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                <span class="loading" id="loading">
                    <span class="spinner"></span>Accediendo...
                </span>
                <span id="loginText">Acceder al Portal</span>
            </button>
        </form>

        <div class="whatsapp-section">
            <p>📱 Únete a nuestro canal de WhatsApp</p>
            <a href="https://whatsapp.com/channel/0029Vb8Mlht2UPBIKGWSFX0R" target="_blank" class="whatsapp-btn">
                💬 Ver Canal WhatsApp
            </a>
        </div>

        <div class="footer">
            <p>Creado por <strong>Yoel</strong> para AlyaBot-MD</p>
            <p>© 2024 - Todos los derechos reservados</p>
            <p>
                <a href="https://github.com/AlyaBot-MD" target="_blank">GitHub</a> •
                <a href="https://discord.gg/alyabot" target="_blank">Discord</a>
            </p>
        </div>
    </div>

    <script>
        // Credenciales válidas (puedes cambiarlas o conectarlas a una base de datos)
        const validCredentials = [
            { email: "admin@alyabot.com", password: "admin123" },
            { email: "yoel@alyabot.com", password: "yoel123" },
            { email: "usuario@alyabot.com", password: "usuario123" }
        ];

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loadingSpinner = document.getElementById('loading');
        const loginText = document.getElementById('loginText');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // Limpiar mensajes previos
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';

            // Validar campos vacíos
            if (!email || !password) {
                showError('Por favor completa todos los campos');
                return;
            }

            // Validar formato de email
            if (!isValidEmail(email)) {
                showError('Por favor ingresa un email válido');
                return;
            }

            // Mostrar cargando
            loadingSpinner.style.display = 'inline';
            loginText.style.display = 'none';

            // Simular delay de servidor
            await new Promise(resolve => setTimeout(resolve, 1500));

            // Verificar credenciales
            const isValid = validCredentials.some(cred => 
                cred.email === email && cred.password === password
            );

            if (isValid) {
                // Guardar datos de sesión
                localStorage.setItem('userEmail', email);
                localStorage.setItem('loginTime', new Date().toISOString());
                localStorage.setItem('isLoggedIn', 'true');

                showSuccess('¡Acceso permitido! Redirigiendo...');

                // Redirigir después de 1.5 segundos
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                showError('Email o contraseña incorrectos');
                loadingSpinner.style.display = 'none';
                loginText.style.display = 'inline';
            }
        });

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }

        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.style.display = 'block';
            loadingSpinner.style.display = 'none';
            loginText.style.display = 'inline';
        }

        function showSuccess(message) {
            successMessage.textContent = '✅ ' + message;
            successMessage.style.display = 'block';
        }

        // Limpiar campos al cargar
        emailInput.value = '';
        passwordInput.value = '';
    </script>
</body>
</html>
