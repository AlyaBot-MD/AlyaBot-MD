<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlyaBot-MD - APIs Key Gratuitas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🤖 AlyaBot-MD</h1>
                <p class="subtitle">Portal de APIs Key Gratuitas</p>
                <p class="creator">Creador: Yoel</p>
            </div>
        </header>

        <!-- Search and Filter Section -->
        <section class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                class="search-bar" 
                placeholder="🔍 Buscar API..."
                onkeyup="filterAPIs()"
            >
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterByCategory('all')">Todas</button>
                <button class="filter-btn" onclick="filterByCategory('ai')">IA</button>
                <button class="filter-btn" onclick="filterByCategory('clima')">Clima</button>
                <button class="filter-btn" onclick="filterByCategory('datos')">Datos</button>
                <button class="filter-btn" onclick="filterByCategory('media')">Media</button>
                <button class="filter-btn" onclick="filterByCategory('otro')">Otros</button>
            </div>
        </section>

        <!-- APIs Grid -->
        <section class="apis-container" id="apisContainer">
            <!-- Las APIs se cargarán aquí -->
        </section>

        <!-- Modal de Detalles -->
        <div id="detailsModal" class="modal" onclick="closeModal(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <h2 id="modalTitle"></h2>
                <div class="modal-body">
                    <p id="modalDescription"></p>
                    <div class="modal-info">
                        <p><strong>Categoría:</strong> <span id="modalCategory"></span></p>
                        <p><strong>Límite:</strong> <span id="modalLimit"></span></p>
                        <p><strong>Documentación:</strong> <a id="modalDocs" href="#" target="_blank">Ver docs</a></p>
                        <p><strong>Estado:</strong> <span id="modalStatus"></span></p>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-primary" onclick="copyToClipboard()">📋 Copiar Endpoint</button>
                        <button class="btn btn-success" onclick="downloadAPI()">⬇️ Descargar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
