<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlyaBot-MD - Portal de APIs Gratuitas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header con Usuario y Logout -->
        <header class="header">
            <div class="header-top">
                <div class="logo-section">
                    <div class="logo">🤖</div>
                    <div class="header-text">
                        <h1>AlyaBot-MD</h1>
                        <p class="subtitle">Portal de APIs Gratuitas</p>
                    </div>
                </div>
                <div class="user-section">
                    <div class="user-info">
                        <span class="user-email" id="userEmail"></span>
                        <button class="logout-btn" onclick="logout()">🚪 Salir</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Search and Filter Section -->
        <section class="search-section">
            <div class="search-wrapper">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-bar" 
                    placeholder="🔍 Buscar API por nombre..."
                    onkeyup="filterAPIs()"
                >
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterByCategory('all')">🌐 Todas</button>
                <button class="filter-btn" onclick="filterByCategory('ai')">🤖 IA</button>
                <button class="filter-btn" onclick="filterByCategory('clima')">🌤️ Clima</button>
                <button class="filter-btn" onclick="filterByCategory('datos')">📊 Datos</button>
                <button class="filter-btn" onclick="filterByCategory('media')">🎨 Media</button>
                <button class="filter-btn" onclick="filterByCategory('bots')">🎮 Bots</button>
                <button class="filter-btn" onclick="filterByCategory('pagos')">💳 Pagos</button>
            </div>
        </section>

        <!-- Stats Section -->
        <section class="stats-container" id="statsContainer"></section>

        <!-- APIs Grid -->
        <section class="apis-container" id="apisContainer">
            <!-- Las APIs se cargarán aquí -->
        </section>

        <!-- Modal de Detalles -->
        <div id="detailsModal" class="modal" onclick="closeModal(event)">
            <div class="modal-content" onclick="event.stopPropagation()">
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <div class="modal-header">
                    <span class="modal-icon" id="modalIcon"></span>
                    <div>
                        <h2 id="modalTitle"></h2>
                        <span id="modalStatus" class="modal-status"></span>
                    </div>
                </div>
                <div class="modal-body">
                    <p id="modalDescription" class="modal-description"></p>
                    <div class="modal-info">
                        <div class="info-row">
                            <span class="info-label">📂 Categoría:</span>
                            <span id="modalCategory" class="info-value"></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">📊 Límite:</span>
                            <span id="modalLimit" class="info-value"></span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">🔗 Documentación:</span>
                            <a id="modalDocs" href="#" target="_blank" class="doc-link">Ver docs →</a>
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button class="btn btn-primary" onclick="copyCode()">📋 Copiar Código</button>
                        <button class="btn btn-success" onclick="downloadAPI()">⬇️ Descargar JSON</button>
                        <button class="btn btn-info" onclick="copyToClipboard(currentModal.endpoint)">🔗 Copiar Endpoint</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentModal = null;
        
        // Verificar autenticación
        function checkAuthentication() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const userEmail = localStorage.getItem('userEmail');

            if (!isLoggedIn || !userEmail) {
                window.location.href = 'login.html';
            } else {
                document.getElementById('userEmail').textContent = '👤 ' + userEmail;
            }
        }

        function logout() {
            if (confirm('¿Estás seguro que deseas salir?')) {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('loginTime');
                window.location.href = 'login.html';
            }
        }

        checkAuthentication();
    </script>

    <script src="script.js"></script>
</body>
</html>
